<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOLO GAMING</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 380px;
      background-color: #1a1a1a;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
    }
    .channel-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #444;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      color: #00bcd4;
    }
    .key-box {
      background-color: #2b2b2b;
      margin-top: 20px;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #key {
      font-size: 16px;
      user-select: text;
    }
    .copy-btn {
      background-color: #00bfa5;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .copy-btn:active {
      transform: scale(0.98);
    }
    .telegram-btn {
      margin-top: 25px;
      display: inline-block;
      background-color: #229ED9;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    .telegram-btn:hover {
      background-color: #1c8cb9;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" class="channel-img">
    <h1>SOLO GAMING</h1>

    <div class="key-box">
      <span id="key">SOLOxGAMING</span>
      <button class="copy-btn" onclick="copyKey()">نسخ</button>
    </div>

    <a class="telegram-btn" href="https://t.me/yz_ui" target="_blank">📢 قناة التليجرام</a>
  </div>

  <script>
    function copyKey() {
      const range = document.createRange();
      const keyElement = document.getElementById("key");
      range.selectNode(keyElement);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);

      try {
        const successful = document.execCommand('copy');
        alert(successful ? "✅ تم نسخ المفتاح" : "❌ فشل النسخ. انسخه يدويًا.");
      } catch (err) {
        alert("❌ لم يتم النسخ. انسخه يدويًا.");
      }

      window.getSelection().removeAllRanges();
    }
  </script>

</body>
</html>
